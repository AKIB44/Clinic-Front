<div class="med-item">
  <div class="med-item-header">
    <div class="med-name">
      {{ item.generic_name }}
      <span class="med-strength">{{ item.strength }}</span>
    </div>
    <button class="med-remove" (click)="remove.emit()" aria-label="Remove">×</button>
  </div>

  <!-- Dosage — chip presets + custom input -->
  <div class="med-row">
    <label class="med-row-label">Dosage</label>
    <div class="chip-row">
      @for (d of dosagePresets; track d) {
        <button type="button" class="chip"
                [class.chip-on]="isOn('dosage', d)"
                (click)="setField('dosage', d)">
          {{ d }}
        </button>
      }
      <input class="chip-input"
             [value]="item.dosage"
             placeholder="custom"
             (input)="onField('dosage', $event)">
    </div>
  </div>

  <!-- Food timing — quick chips -->
  <div class="med-row">
    <label class="med-row-label">Timing</label>
    <div class="chip-row">
      @for (f of foodPresets; track f) {
        <button type="button" class="chip"
                [class.chip-on]="isOn('frequency', f)"
                (click)="setField('frequency', f)">
          {{ f }}
        </button>
      }
    </div>
  </div>

  <!-- Duration + Qty — duration chip auto-fills qty -->
  <div class="med-row med-row-split">
    <div class="med-split">
      <label class="med-row-label">Duration</label>
      <div class="chip-row">
        @for (d of durationPresets; track d) {
          <button type="button" class="chip chip-sm"
                  [class.chip-on]="isOn('duration', d + ' days')"
                  (click)="setDuration(d)">
            {{ d }}d
          </button>
        }
        <input class="chip-input chip-input-sm"
               [value]="item.duration"
               placeholder="custom"
               (input)="onField('duration', $event)">
      </div>
    </div>
    <div class="med-split med-split-qty">
      <label class="med-row-label">Qty</label>
      <input class="chip-input chip-input-qty"
             [value]="item.quantity"
             placeholder="auto"
             (input)="onField('quantity', $event)">
    </div>
  </div>
</div>

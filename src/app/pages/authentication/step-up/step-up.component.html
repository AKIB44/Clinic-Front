<div class="blank-layout-container justify-content-center">
  <div class="auth-wrapper">
    <div class="position-relative shaper-wrapper">
      <div class="w-100 position-relative rounded bg-white auth-card">
        <div class="auth-body">
          <a [routerLink]="['/dashboards/dashboard1']" class="m-t-20 d-flex">
            <img
              src="./assets/images/logos/dflogo.png"
              class="align-middle m-2"
              alt="DentaFlow"
            />
          </a>

          <div class="row">
            <div class="col-lg-6">
              <div class="align-items-center justify-content-center d-none d-lg-flex">
                <img
                  src="/assets/images/backgrounds/login3-bg.png"
                  alt="step-up"
                  style="max-width: 500px"
                />
              </div>
            </div>
            <div class="col-lg-6">
              <div class="d-flex align-items-start align-items-lg-center justify-content-center">
                <div class="row justify-content-center w-100">
                  <div class="col-lg-11">
                    <div class="d-flex align-items-center gap-2 m-t-20">
                      <mat-icon color="warn">lock</mat-icon>
                      <h4 class="f-w-700 f-s-24 m-0 lh-base">Confirm Identity</h4>
                    </div>
                    <span class="f-s-14 d-block mat-body-1 m-t-8">
                      This action requires additional verification. Enter your password to continue.
                    </span>

                    <form class="m-t-30" [formGroup]="form" (ngSubmit)="submit()">
                      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">
                        Password
                      </mat-label>
                      <mat-form-field appearance="outline" class="w-100" color="primary">
                        <input
                          matInput
                          [type]="hidePassword ? 'password' : 'text'"
                          formControlName="password"
                          autocomplete="current-password"
                          autofocus
                        />
                        <button
                          mat-icon-button
                          matSuffix
                          type="button"
                          (click)="hidePassword = !hidePassword"
                          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
                        >
                          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                        @if (f['password'].touched && f['password'].invalid) {
                          <mat-hint class="m-b-16 error-msg">
                            <div class="text-error">Password is required.</div>
                          </mat-hint>
                        }
                      </mat-form-field>

                      @if (error) {
                        <div class="text-error m-b-12 f-s-13">{{ error }}</div>
                      }

                      <button
                        mat-flat-button
                        color="primary"
                        class="w-100 m-t-8"
                        type="submit"
                        [disabled]="isSubmitting"
                      >
                        {{ isSubmitting ? 'Verifying…' : 'Confirm & Continue' }}
                      </button>

                      <button
                        mat-stroked-button
                        class="w-100 m-t-12"
                        type="button"
                        [routerLink]="['/schedule']"
                      >
                        Cancel
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

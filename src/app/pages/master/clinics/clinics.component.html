<div class="master-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Clinics</h1>
      <p class="page-subtitle">Manage all clinics on the platform</p>
    </div>
    <button mat-flat-button color="primary" (click)="openDialog()">
      <i-tabler name="plus" size="18"></i-tabler>
      Add Clinic
    </button>
  </div>

  @if (loading) {
    <div class="center-loader"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <div class="master-card">
      <table mat-table [dataSource]="clinics" class="master-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Clinic Name</th>
          <td mat-cell *matCellDef="let c"><div class="cell-primary">{{ c.name }}</div></td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>City</th>
          <td mat-cell *matCellDef="let c">{{ c.city }}{{ c.state ? ', ' + c.state : '' }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let c">{{ c.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let c">{{ c.email }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let c">
            <span class="status-chip" [class.active]="c.is_active" [class.inactive]="!c.is_active">
              <span class="dot"></span>{{ c.is_active ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let c">
            <div class="action-row">
              <button mat-icon-button matTooltip="Edit" (click)="openDialog(c)">
                <i-tabler name="pencil" size="16"></i-tabler>
              </button>
              <button mat-icon-button [matTooltip]="c.is_active ? 'Deactivate' : 'Activate'" (click)="toggle(c)">
                <i-tabler [name]="c.is_active ? 'toggle-right' : 'toggle-left'" size="18"></i-tabler>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">No clinics found.</td>
        </tr>
      </table>
    </div>
  }
</div>

<div class="case-list-page">
  <header class="case-list-page__header">
    <h2>Implant Cases</h2>
    <a mat-raised-button color="primary" [routerLink]="['/specialty/implantology/cases/new']">+ New Case</a>
  </header>
  @if (loading()) {
    <p>Loading…</p>
  } @else if (cases().length === 0) {
    <p class="empty">No active Implant cases.</p>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="cases()">
        <ng-container matColumnDef="patient_name">
          <th mat-header-cell *matHeaderCellDef>Patient</th>
          <td mat-cell *matCellDef="let c">{{ $any(c).patient_name }}</td>
        </ng-container>
        <ng-container matColumnDef="external_case_no">
          <th mat-header-cell *matHeaderCellDef>Case No.</th>
          <td mat-cell *matCellDef="let c">{{ $any(c).external_case_no ?? '—' }}</td>
        </ng-container>
        <ng-container matColumnDef="started_at">
          <th mat-header-cell *matHeaderCellDef>Started</th>
          <td mat-cell *matCellDef="let c">{{ $any(c).started_at | date:'mediumDate' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let c">
            <a mat-button [routerLink]="['/specialty/implantology/cases', $any(c).id]">View</a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>
    </mat-card>
  }
</div>
